name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install mss pillow rapidfuzz pyinstaller
      - run: python -m PyInstaller --onefile --noconsole --name ROXQuizHelper app.py
      - name: Bundle Tesseract + Thai data
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          Copy-Item "C:\Program Files\Tesseract-OCR" dist\tesseract -Recurse
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata_fast/raw/main/tha.traineddata -OutFile dist\tesseract\tessdata\tha.traineddata
          Copy-Item qa.json dist\qa.json
          & dist\tesseract\tesseract.exe --list-langs
      - uses: actions/upload-artifact@v4
        with:
          name: ROXQuizHelper
          path: dist
